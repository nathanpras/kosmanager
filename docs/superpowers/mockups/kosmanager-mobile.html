<title>Kosmanager Mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">

<style>
@layer tokens, components, screens;

/* ─────────────────────────────────────────────
   TOKENS — lapis ini disalin utuh ke src/style.css saat port
   ───────────────────────────────────────────── */
@layer tokens {
  :root {
    /* kanvas bernada biru, bukan abu netral */
    --ground:      #EDF2F8;
    --surface:     #FFFFFF;
    --surface-2:   #E3EBF3;
    --line:        #DBE5EF;
    --line-soft:   #EAF0F6;

    --ink:         #16232E;
    --ink-2:       #5C6E7D;
    --ink-3:       #93A4B3;

    --brand:       #0070C0;
    --brand-deep:  #004E86;
    --brand-tint:  #E1EFFB;

    --gold:        #FFC000;
    --gold-tint:   #FFF3D4;
    --gold-ink:    #8A6400;

    --ok:          #0D8A5F;  --ok-tint:   #DFF3EA;
    --warn:        #A97400;  --warn-tint: #FFF1CF;
    --bad:         #D4443F;  --bad-tint:  #FBE9E8;

    --r-card:  18px;
    --r-field: 14px;
    --r-pill:  999px;

    --sh-1: 0 1px 2px rgba(22,35,46,.04), 0 1px 3px rgba(22,35,46,.05);
    --sh-2: 0 6px 22px rgba(22,35,46,.10);
    --sh-fab: 0 8px 24px rgba(0,78,134,.34);
    --sh-sheet: 0 -10px 46px rgba(22,35,46,.22);

    --ease:  cubic-bezier(.32,.72,0,1);
    --t-nav: 260ms;
    --t-tab: 220ms;
    --t-sheet: 320ms;
  }
}

/* ─────────────────────────────────────────────
   COMPONENTS — lapis ini juga ikut pindah saat port
   ───────────────────────────────────────────── */
@layer components {
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: #0E1D28; }

  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    background: #0E1D28;
    background-image: radial-gradient(120% 80% at 50% 0%, #163141 0%, #0E1D28 62%);
    color: var(--ink);
    min-height: 100dvh;
    display: grid;
    place-items: center;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 6px; }

  /* Perangkat */
  .phone {
    position: relative;
    width: 390px;
    height: 844px;
    background: var(--ground);
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 0 0 10px #1B2E3B, 0 0 0 11px #2C4353, 0 40px 90px rgba(0,0,0,.55);
    isolation: isolate;
  }

  @media (max-width: 480px) {
    body { display: block; }
    .phone {
      width: 100vw; height: 100dvh;
      border-radius: 0; box-shadow: none;
    }
    .statusbar { display: none !important; }
    .topbar { padding-top: calc(12px + env(safe-area-inset-top)); }
    .tabbar { padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
  }

  /* Status bar palsu — hanya saat dilihat di desktop */
  .statusbar {
    position: absolute; inset: 0 0 auto 0; height: 46px; z-index: 60;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 30px; font-size: 14px; font-weight: 700; letter-spacing: .2px;
    color: var(--ink); pointer-events: none;
  }
  .statusbar .sb-r { display: flex; align-items: center; gap: 6px; }

  /* Tumpukan layar */
  .stack { position: absolute; inset: 0; overflow: hidden; }

  .screen {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    background: var(--ground);
    will-change: transform;
  }
  .screen[data-depth="0"] .scroll { padding-top: 0; }

  .topbar {
    flex: none; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: 46px 18px 12px;
    background: var(--ground);
    transition: box-shadow 180ms linear, background 180ms linear;
  }
  .topbar.is-stuck {
    background: color-mix(in srgb, var(--ground) 86%, white);
    box-shadow: 0 1px 0 var(--line);
    backdrop-filter: saturate(1.4) blur(10px);
  }
  .topbar h1 { font-size: 22px; font-weight: 800; letter-spacing: -.5px; flex: 1; text-wrap: balance; }
  .topbar h1.sm { font-size: 19px; }

  .iconbtn {
    flex: none; display: grid; place-items: center;
    width: 44px; height: 44px; margin: -11px 0; border-radius: 50%;
    color: var(--ink); transition: background 140ms linear, transform 120ms var(--ease);
  }
  .iconbtn:hover { background: var(--surface-2); }
  .iconbtn:active { transform: scale(.9); }
  .iconbtn.lead { margin-left: -11px; }

  .scroll {
    flex: 1; overflow-y: auto; overflow-x: hidden;
    -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain;
    padding: 4px 18px 120px;
    scrollbar-width: none;
  }
  .scroll::-webkit-scrollbar { width: 0; }

  /* Kartu */
  .card {
    background: var(--surface);
    border-radius: var(--r-card);
    box-shadow: var(--sh-1);
    padding: 16px;
  }
  .card.flush { padding: 0; overflow: hidden; }

  .tap {
    width: 100%; text-align: left;
    transition: transform 100ms var(--ease), box-shadow 160ms linear;
  }
  .tap:active { transform: scale(.98); box-shadow: 0 0 0 1px var(--line); }

  .stack-v { display: flex; flex-direction: column; gap: 10px; }
  .stack-v.tight { gap: 8px; }
  .row-between { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

  /* Judul seksi */
  .sechead {
    display: flex; align-items: center; gap: 10px;
    padding: 22px 2px 12px;
  }
  .sechead h2 { font-size: 17px; font-weight: 800; letter-spacing: -.35px; }
  .count {
    display: grid; place-items: center; min-width: 26px; height: 24px; padding: 0 8px;
    border-radius: var(--r-pill); background: var(--surface-2);
    font-size: 12px; font-weight: 700; color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .sechead .link { margin-left: auto; }

  .link {
    color: var(--brand); font-size: 14px; font-weight: 700;
    padding: 8px 4px; margin: -8px -4px; border-radius: 8px;
  }
  .link:active { background: var(--brand-tint); }

  /* Chip status */
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    height: 26px; padding: 0 10px; border-radius: var(--r-pill);
    font-size: 12px; font-weight: 700; letter-spacing: -.1px; white-space: nowrap;
  }
  .chip svg { width: 13px; height: 13px; }
  .chip.ok    { background: var(--ok-tint);    color: var(--ok); }
  .chip.warn  { background: var(--warn-tint);  color: var(--warn); }
  .chip.bad   { background: var(--bad-tint);   color: var(--bad); }
  .chip.brand { background: var(--brand-tint); color: var(--brand-deep); }
  .chip.gold  { background: var(--gold-tint);  color: var(--gold-ink); }
  .chip.mute  { background: var(--surface-2);  color: var(--ink-2); }

  /* Chip statistik yang bisa ditekan */
  .statchip {
    display: inline-flex; align-items: center; gap: 8px;
    height: 40px; padding: 0 8px 0 14px; border-radius: var(--r-pill);
    border: 1px solid var(--line); background: var(--surface);
    font-size: 14px; font-weight: 600; color: var(--ink);
    transition: transform 100ms var(--ease), border-color 140ms linear, background 140ms linear;
  }
  .statchip:active { transform: scale(.95); background: var(--surface-2); }
  .statchip b {
    display: grid; place-items: center; min-width: 26px; height: 26px; padding: 0 7px;
    border-radius: var(--r-pill); background: var(--brand-tint); color: var(--brand-deep);
    font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .statchip.is-bad  { border-color: color-mix(in srgb, var(--bad) 32%, var(--line)); color: var(--bad); }
  .statchip.is-bad b  { background: var(--bad-tint);  color: var(--bad); }
  .statchip.is-warn { border-color: color-mix(in srgb, var(--warn) 34%, var(--line)); color: var(--warn); }
  .statchip.is-warn b { background: var(--warn-tint); color: var(--warn); }
  .statchip.is-zero { color: var(--ink-3); }
  .statchip.is-zero b { background: var(--surface-2); color: var(--ink-3); }

  /* Avatar */
  .av {
    flex: none; display: grid; place-items: center;
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--brand-tint); color: var(--brand-deep);
    font-size: 15px; font-weight: 800; letter-spacing: -.3px;
    font-variant-numeric: tabular-nums;
  }
  .av.gold { background: var(--gold-tint); color: var(--gold-ink); }
  .av.sq { border-radius: 14px; }
  .av.lg { width: 76px; height: 76px; font-size: 26px; }
  .av.ghost { background: var(--surface-2); color: var(--ink-3); }

  /* Tab pil dengan indikator yang bergeser */
  .ptabs {
    position: relative; display: flex; gap: 2px;
    background: var(--surface); border-radius: var(--r-pill);
    padding: 4px; box-shadow: var(--sh-1);
    margin: 4px 0 6px;
  }
  .ptabs-ind {
    position: absolute; top: 4px; bottom: 4px; left: 0;
    border-radius: var(--r-pill); background: var(--brand-tint);
    transition: transform var(--t-tab) var(--ease), width var(--t-tab) var(--ease);
    will-change: transform, width;
  }
  .ptab {
    position: relative; flex: 1; height: 40px; border-radius: var(--r-pill);
    font-size: 14px; font-weight: 700; color: var(--ink-2); letter-spacing: -.2px;
    transition: color var(--t-tab) var(--ease);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ptab.is-on { color: var(--brand-deep); }

  /* Chip filter */
  .filterbar { display: flex; gap: 8px; overflow-x: auto; padding: 4px 18px 8px; margin: 0 -18px; scrollbar-width: none; }
  .filterbar::-webkit-scrollbar { height: 0; }
  .fchip {
    flex: none; height: 38px; padding: 0 14px; border-radius: var(--r-pill);
    background: var(--surface); border: 1px solid var(--line);
    font-size: 13px; font-weight: 700; color: var(--ink-2);
    transition: transform 100ms var(--ease), background 140ms linear, color 140ms linear, border-color 140ms linear;
  }
  .fchip:active { transform: scale(.94); }
  .fchip.is-on { background: var(--brand); border-color: var(--brand); color: #fff; }

  /* Kolom cari */
  .search {
    display: flex; align-items: center; gap: 10px;
    height: 46px; padding: 0 14px; border-radius: var(--r-field);
    background: var(--surface); box-shadow: var(--sh-1); color: var(--ink-3);
  }
  .search input {
    flex: 1; border: 0; background: none; font: inherit; font-size: 15px;
    color: var(--ink); outline: none; min-width: 0;
  }
  .search input::placeholder { color: var(--ink-3); font-weight: 500; }

  /* Baris daftar */
  .lrow { display: flex; align-items: center; gap: 13px; padding: 14px 16px; }
  .lrow-body { flex: 1; min-width: 0; }
  .lrow-title { font-size: 16px; font-weight: 700; letter-spacing: -.3px; }
  .lrow-sub { font-size: 13.5px; color: var(--ink-2); margin-top: 2px; font-weight: 500; }
  .lrow-meta { display: flex; align-items: center; gap: 7px; margin-top: 8px; flex-wrap: wrap; }
  .lrow .chev { color: var(--ink-3); flex: none; }

  .divide > * + * { border-top: 1px solid var(--line-soft); }

  /* Grid label/nilai */
  .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 12px; }
  .kv-k { font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: .3px; text-transform: uppercase; }
  .kv-v { font-size: 15.5px; font-weight: 700; margin-top: 3px; letter-spacing: -.2px; }
  .kv-v.soft { font-weight: 600; color: var(--ink-2); }
  .kv-v small { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-top: 1px; }

  /* Tombol */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    height: 40px; padding: 0 16px; border-radius: var(--r-pill);
    font-size: 14px; font-weight: 700; letter-spacing: -.2px;
    background: var(--surface-2); color: var(--ink);
    transition: transform 100ms var(--ease), background 140ms linear;
  }
  .btn:active { transform: scale(.95); }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.brandsoft { background: var(--brand-tint); color: var(--brand-deep); }
  .btn.sm { height: 34px; padding: 0 13px; font-size: 13px; }

  /* FAB */
  .fab {
    position: absolute; right: 18px; bottom: 26px; z-index: 30;
    display: inline-flex; align-items: center; gap: 9px;
    height: 54px; padding: 0 22px 0 18px; border-radius: var(--r-pill);
    background: var(--brand-deep); color: #fff;
    font-size: 15px; font-weight: 700; letter-spacing: -.2px; white-space: nowrap;
    box-shadow: var(--sh-fab);
    transition: padding var(--t-tab) var(--ease), transform 160ms var(--ease);
  }
  .fab .fab-label {
    max-width: 120px; overflow: hidden;
    transition: max-width var(--t-tab) var(--ease), opacity 160ms linear;
  }
  .fab.is-tucked { padding: 0; width: 54px; justify-content: center; }
  .fab.is-tucked .fab-label { max-width: 0; opacity: 0; }
  .fab:active { transform: scale(.93); }
  .screen[data-depth="0"] .fab { bottom: 84px; }

  /* Tab bawah */
  .tabbar {
    position: absolute; inset: auto 0 0 0; z-index: 40;
    display: flex; padding: 6px 10px;
    background: color-mix(in srgb, var(--surface) 88%, transparent);
    backdrop-filter: saturate(1.6) blur(18px);
    border-top: 1px solid var(--line-soft);
    transition: transform var(--t-nav) var(--ease), opacity 200ms linear;
  }
  .tabbar.is-hidden { transform: translateY(102%); opacity: 0; pointer-events: none; }
  .tabitem {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 8px 0 6px; border-radius: 16px; color: var(--ink-3);
    font-size: 11.5px; font-weight: 700; letter-spacing: -.1px;
  }
  .tabitem .tabicon {
    display: grid; place-items: center; width: 56px; height: 30px; border-radius: var(--r-pill);
    transition: background var(--t-tab) var(--ease), color var(--t-tab) var(--ease);
  }
  .tabitem.is-on { color: var(--brand-deep); }
  .tabitem.is-on .tabicon { background: var(--brand-tint); }
  .tabitem:active .tabicon { transform: scale(.9); }

  /* Bottom sheet */
  .scrim {
    position: absolute; inset: 0; z-index: 50;
    background: rgba(12,26,36,.42);
    animation: fadeIn 220ms linear both;
  }
  .scrim.is-out { animation: fadeOut 200ms linear both; }

  .sheet {
    position: absolute; inset: auto 0 0 0; z-index: 51;
    background: var(--surface);
    border-radius: 26px 26px 0 0;
    box-shadow: var(--sh-sheet);
    padding-bottom: max(14px, env(safe-area-inset-bottom));
    max-height: 82%;
    display: flex; flex-direction: column;
    animation: sheetUp var(--t-sheet) var(--ease) both;
    will-change: transform;
  }
  .sheet.is-out { animation: sheetDown 240ms var(--ease) both; }
  .sheet.is-dragging { animation: none; transition: none; }
  .sheet.is-settling { animation: none; transition: transform 300ms var(--ease); }

  .sheet-grab { flex: none; padding: 10px 0 4px; display: grid; place-items: center; cursor: grab; touch-action: none; }
  .sheet-grab::before { content: ''; width: 38px; height: 4px; border-radius: 4px; background: var(--surface-2); }
  .sheet-head { flex: none; padding: 6px 20px 12px; touch-action: none; }
  .sheet-title { font-size: 17px; font-weight: 800; letter-spacing: -.35px; }
  .sheet-sub { font-size: 13.5px; color: var(--ink-2); font-weight: 500; margin-top: 2px; }
  .sheet-body { overflow-y: auto; padding: 0 12px 10px; scrollbar-width: none; }
  .sheet-body::-webkit-scrollbar { width: 0; }

  .aitem {
    display: flex; align-items: center; gap: 14px; width: 100%;
    padding: 13px 12px; border-radius: 15px; text-align: left;
    transition: background 120ms linear, transform 100ms var(--ease);
  }
  .aitem:active { background: var(--surface-2); transform: scale(.985); }
  .aitem-ic {
    flex: none; display: grid; place-items: center; width: 40px; height: 40px;
    border-radius: 13px; background: var(--brand-tint); color: var(--brand-deep);
  }
  .aitem-t { flex: 1; font-size: 15.5px; font-weight: 700; letter-spacing: -.2px; }
  .aitem-t small { display: block; font-size: 13px; font-weight: 500; color: var(--ink-2); margin-top: 1px; letter-spacing: 0; }
  .aitem.danger .aitem-ic { background: var(--bad-tint); color: var(--bad); }
  .aitem.danger .aitem-t { color: var(--bad); }

  /* Kotak peringatan */
  .note {
    display: flex; gap: 11px; padding: 13px 14px; border-radius: 15px;
    font-size: 13.5px; font-weight: 600; line-height: 1.45;
  }
  .note.bad  { background: var(--bad-tint);  color: #8E2622; }
  .note.info { background: var(--brand-tint); color: var(--brand-deep); }
  .note svg { flex: none; margin-top: 1px; }

  /* Keadaan kosong */
  .empty { text-align: center; padding: 34px 22px; }
  .empty-art { display: grid; place-items: center; margin-bottom: 16px; }
  .empty h3 { font-size: 18px; font-weight: 800; letter-spacing: -.35px; }
  .empty p { font-size: 14px; color: var(--ink-2); margin-top: 7px; line-height: 1.5; font-weight: 500; }

  /* Toast */
  .toast {
    position: absolute; left: 50%; bottom: 96px; z-index: 70;
    transform: translateX(-50%);
    background: var(--ink); color: #fff;
    padding: 11px 18px; border-radius: var(--r-pill);
    font-size: 13.5px; font-weight: 600; white-space: nowrap;
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
    animation: toastIn 240ms var(--ease) both;
  }
  .toast.is-out { animation: toastOut 200ms var(--ease) both; }

  /* Animasi */
  @keyframes pushIn   { from { transform: translateX(100%); } to { transform: translateX(0); } }
  @keyframes pushBack { from { transform: translateX(0); filter: brightness(1); }
                        to   { transform: translateX(-24%); filter: brightness(.94); } }
  @keyframes popFwd   { from { transform: translateX(-24%); filter: brightness(.94); }
                        to   { transform: translateX(0); filter: brightness(1); } }
  @keyframes popOut   { from { transform: translateX(0); } to { transform: translateX(100%); } }
  @keyframes fadeUp   { from { opacity: 0; transform: translateY(6px) scale(.995); } to { opacity: 1; transform: none; } }
  @keyframes fadeGone { from { opacity: 1; } to { opacity: 0; } }
  @keyframes fadeIn   { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut  { from { opacity: 1; } to { opacity: 0; } }
  @keyframes sheetUp  { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes sheetDown{ from { transform: translateY(0); } to { transform: translateY(100%); } }
  @keyframes rise     { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes toastIn  { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
  @keyframes toastOut { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, 8px); } }

  .anim-pushIn   { animation: pushIn   var(--t-nav) var(--ease) both; z-index: 12; }
  .anim-pushBack { animation: pushBack var(--t-nav) var(--ease) both; z-index: 11; }
  .anim-popFwd   { animation: popFwd   var(--t-nav) var(--ease) both; z-index: 11; }
  .anim-popOut   { animation: popOut   var(--t-nav) var(--ease) both; z-index: 12; }
  .anim-fadeUp   { animation: fadeUp   240ms var(--ease) both; z-index: 12; }
  .anim-fadeGone { animation: fadeGone 180ms linear both; z-index: 11; }

  .stagger > * { animation: rise 380ms var(--ease) both; animation-delay: calc(var(--i, 0) * 28ms); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 1ms !important;
      animation-delay: 0ms !important;
      transition-duration: 1ms !important;
    }
  }
}

/* ─────────────────────────────────────────────
   SCREENS — tata letak khusus, ditulis ulang saat port
   ───────────────────────────────────────────── */
@layer screens {
  .greet { padding: 18px 18px 16px; }
  .greet-top { display: flex; align-items: flex-start; gap: 12px; }
  .greet h2 { font-size: 21px; font-weight: 800; letter-spacing: -.5px; }
  .greet p { font-size: 13.5px; color: var(--ink-2); font-weight: 500; margin-top: 2px; }
  .greet-badge {
    flex: none; display: grid; place-items: center; width: 46px; height: 46px;
    border-radius: 50%; background: var(--gold-tint); color: var(--gold-ink);
    box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--gold) 45%, transparent);
  }
  .statgrid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }

  .proprow .av.sq { width: 46px; height: 46px; font-size: 14px; }

  .roomno {
    flex: none; display: grid; place-items: center;
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--brand-tint); color: var(--brand-deep);
    font-size: 14.5px; font-weight: 800; font-variant-numeric: tabular-nums;
  }
  .roomno.vacant { background: var(--surface-2); color: var(--ink-3); }

  .leasecard { padding: 0; overflow: hidden; }
  .leasecard-top { display: flex; align-items: center; gap: 13px; padding: 16px; }
  .leasecard-grid { padding: 0 16px 16px; }

function tgl(iso) {
  if (!iso) return '–';
  const [y, m, d] = iso.split('-').map(Number);
  return `${String(d).padStart(2, '0')} ${BLN[m - 1]} ${y}`;
}

function durasi(iso) {
  if (!iso) return '–';
  const [y, m, d] = iso.split('-').map(Number);
  const mulai = new Date(y, m - 1, d);
  if (mulai > TODAY) return 'Belum mulai';
  const hari = Math.floor((TODAY - mulai) / 864e5);
  if (hari < 31) {
    const w = Math.floor(hari / 7), s = hari % 7;
    return (w ? `${w} minggu` : '') + (w && s ? ' ' : '') + (s || !w ? `${s} hari` : '');
  }
  let bulan = (TODAY.getFullYear() - y) * 12 + (TODAY.getMonth() - (m - 1));
  const anchor = new Date(TODAY.getFullYear(), TODAY.getMonth(), d);
  if (anchor > TODAY) bulan--;
  const ref = new Date(y, m - 1 + bulan, d);
  const sisa = Math.floor((TODAY - ref) / 864e5);
  return `${bulan} bulan` + (sisa ? ` ${sisa} hari` : '');
}

  if (awal > TODAY) awal = new Date(TODAY.getFullYear(), TODAY.getMonth() - 1, d);
  const akhir = new Date(awal.getFullYear(), awal.getMonth() + 1, d);
  const f = x => `${String(x.getDate()).padStart(2, '0')} ${BLN[x.getMonth()]}`;
  return `${f(awal)} – ${f(akhir)}`;
}

  const Y = 2026, M = 8;                       // September 2026
  const pertama = new Date(Y, M, 1).getDay();  // 0 = Minggu
  const offset = (pertama + 6) % 7;            // pekan mulai Senin
  const jml = new Date(Y, M + 1, 0).getDate();

  const tanda = {};
  const tandai = (d, w) => { (tanda[d] = tanda[d] || new Set()).add(w); };
  ROOMS.forEach(r => {
    if (r.masuk) {
      const [y, m, d] = r.masuk.split('-').map(Number);
      if (y === Y && m - 1 === M) tandai(d, 'in');
      if (r.tglTagih) tandai(r.tglTagih, r.status === 'telat' ? 'late' : 'due');
    }
  });
  const WARNA = { in: 'var(--ok)', due: 'var(--brand)', late: 'var(--bad)' };

  let sel = '';
  for (let i = 0; i < offset; i++) sel += '<span class="cal-day mute"></span>';
  for (let d = 1; d <= jml; d++) {
    const t = tanda[d] ? [...tanda[d]] : [];
    sel += `<button class="cal-day ${d === 27 ? 'today' : ''}" data-act="soon">${d}
      ${t.length ? `<span class="cal-dots">${t.map(k => `<i style="background:${WARNA[k]}"></i>`).join('')}</span>` : ''}
    </button>`;
  }

  return topbar({ title: 'Kalender', actions: [{ icon: 'more', act: 'soon', label: 'Menu kalender' }] })
  + `<div class="scroll">
    <section class="card cal stagger" style="padding:14px">

        <span><i style="background:var(--ok)"></i>Check-in</span>

        <span class="av" style="background:var(--ok-tint);color:var(--ok)">${ic('in', 20)}</span>
        <span class="lrow-body">
          <span class="lrow-title">Check-in ${esc(r.nama)}</span>

};

/* ══════════════════════════════════════════════
   7. BOTTOM SHEET
   ══════════════════════════════════════════════ */
const SHEETS = {
  aksi: rid => {
    const r = room(rid);
    return {
      title: 'Pilih aksi',
      sub: `${r.nama} · Kamar ${r.no}`,
      items: [
        { i: 'money',   t: 'Catat pembayaran', s: 'Tandai sewa periode ini sudah dibayar' },
        { i: 'receipt', t: 'Tambah tagihan',   s: 'Buat tagihan baru di luar sewa bulanan' },
        { i: 'wallet',  t: 'Tambah deposit',   s: 'Catat uang jaminan yang diterima' },
        { i: 'plus',    t: 'Tambah biaya lain',s: 'Listrik, air, denda, atau kerusakan' },
        { i: 'door',    t: 'Lihat kamar',      s: 'Buka detail kamar ' + r.no, go: 'room/' + r.id },
        { i: 'sliders', t: 'Pengaturan sewa',  s: 'Harga, masa tinggal, pindah kamar', sheet: 'sewa:' + r.id },
      ],

  },
  sewa: rid => {

    return {

      sub: `${r.nama} · Kamar ${r.no}`,
      items: [
        { i: 'money',  t: 'Ubah harga',        s: 'Sekarang ' + rp(r.harga) + ' / bulan' },
        { i: 'cal',    t: 'Ubah masa tinggal', s: 'Check-in ' + tgl(r.masuk) },
        { i: 'move',   t: 'Pindah kamar',      s: 'Pindahkan penghuni ke kamar lain' },
        { i: 'trash',  t: 'Hapus sewa',        s: 'Data sewa dan tagihannya ikut terhapus', danger: true },
      ],
    };
  },
};

let sheetEl = null, scrimEl = null;

function openSheet(spec) {
  const [key, arg] = spec.split(':');
  const def = SHEETS[key] && SHEETS[key](arg);
  if (!def) return;
  closeSheet(true);

  scrimEl = document.createElement('div');
  scrimEl.className = 'scrim';
  scrimEl.addEventListener('click', () => closeSheet());

  sheetEl = document.createElement('div');
  sheetEl.className = 'sheet';
  sheetEl.setAttribute('role', 'dialog');
  sheetEl.setAttribute('aria-label', def.title);
  sheetEl.innerHTML = `
    <div class="sheet-grab" data-drag></div>
    <div class="sheet-head" data-drag>
      <div class="sheet-title">${esc(def.title)}</div>
      ${def.sub ? `<div class="sheet-sub">${esc(def.sub)}</div>` : ''}
    </div>
    <div class="sheet-body">
      ${def.items.map(it => `<button class="aitem ${it.danger ? 'danger' : ''}"
        ${it.go ? `data-go="${it.go}"` : it.sheet ? `data-sheet="${it.sheet}"` : 'data-act="soon"'}>
        <span class="aitem-ic">${ic(it.i, 20)}</span>
        <span class="aitem-t">${esc(it.t)}<small>${esc(it.s)}</small></span>
        ${it.sheet ? `<span class="chev" style="color:var(--ink-3)">${ic('chev', 18)}</span>` : ''}
      </button>`).join('')}
    </div>`;

  phone.append(scrimEl, sheetEl);
  wireDrag(sheetEl);
}

function closeSheet(instant) {
  if (!sheetEl) return;
  const s = sheetEl, k = scrimEl;
  sheetEl = scrimEl = null;
  if (instant) { s.remove(); k && k.remove(); return; }
  s.classList.remove('is-dragging', 'is-settling');
  s.style.transform = '';
  s.classList.add('is-out');
  k && k.classList.add('is-out');
  s.addEventListener('animationend', () => { s.remove(); k && k.remove(); }, { once: true });
}

/* Tarik turun untuk menutup, dengan rubber band ke atas */
function wireDrag(el) {
  let y0 = 0, dy = 0, t0 = 0, aktif = false;
  const h = () => el.getBoundingClientRect().height;

  const down = e => {
    if (!e.target.closest('[data-drag]')) return;
    aktif = true; y0 = e.clientY; t0 = performance.now(); dy = 0;
    el.classList.add('is-dragging');
    el.setPointerCapture(e.pointerId);
  };
  const move = e => {
    if (!aktif) return;
    dy = e.clientY - y0;
    const v = dy < 0 ? -Math.pow(-dy, .62) : dy;   // resistensi saat ditarik ke atas
    el.style.transform = `translateY(${v}px)`;
  };
  const up = e => {
    if (!aktif) return;
    aktif = false;
    el.classList.remove('is-dragging');
    const kec = dy / Math.max(1, performance.now() - t0);
    if (dy > h() * .28 || kec > .55) {
      el.style.transform = `translateY(${h()}px)`;
      el.classList.add('is-settling');
      scrimEl && scrimEl.classList.add('is-out');
      const s = el, k = scrimEl;
      sheetEl = scrimEl = null;
      setTimeout(() => { s.remove(); k && k.remove(); }, 280);
    } else {
      el.classList.add('is-settling');
      el.style.transform = 'translateY(0)';
      setTimeout(() => el.classList.remove('is-settling'), 320);
    }
  };
  el.addEventListener('pointerdown', down);
  el.addEventListener('pointermove', move);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
}

/* ══════════════════════════════════════════════
   8. TOAST
   ══════════════════════════════════════════════ */
let toastT = null;
function toast(pesan) {
  const lama = phone.querySelector('.toast');
  if (lama) lama.remove();
  clearTimeout(toastT);
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  el.textContent = pesan;
  phone.append(el);
  toastT = setTimeout(() => {
    el.classList.add('is-out');
    el.addEventListener('animationend', () => el.remove(), { once: true });
  }, 1900);
}

/* ══════════════════════════════════════════════
   9. ROUTER
   ══════════════════════════════════════════════ */
const phone  = document.getElementById('phone');
const stack  = document.getElementById('stack');
const tabbar = document.getElementById('tabbar');

const TABS = [
  { r: 'home',     i: 'door',  l: 'Properti' },
  { r: 'calendar', i: 'cal',   l: 'Kalender' },
  { r: 'tenants',  i: 'users', l: 'Penghuni' },
];

const depth = r =>
  r.startsWith('tenant/') ? 3 :
  r.startsWith('room/')   ? 2 :
  (r.startsWith('prop/') || r.startsWith('filter/')) ? 1 : 0;

const tabState = {};                 // tab aktif per rute, dipulihkan saat kembali
let saatIni = null, layarEl = null;

function render(rute) {
  const [nama, arg] = rute.split('/');
  const tab = tabState[rute] || 0;
  if (nama === 'prop')   return VIEWS.prop(arg, tab);
  if (nama === 'room')   return VIEWS.room(arg, tab);
  if (nama === 'tenant') return VIEWS.tenant(arg);
  if (nama === 'filter') return VIEWS.filter(arg);
  return (VIEWS[nama] || VIEWS.home)();
}

function pasang(rute, arah) {
  const baru = document.createElement('section');
  baru.className = 'screen';
  baru.dataset.route = rute;
  baru.dataset.depth = depth(rute);
  baru.innerHTML = render(rute);

  const lama = layarEl;
  stack.append(baru);
  layarEl = baru;

  if (lama) {
    const [masuk, keluar] =
      arah === 'push' ? ['anim-pushIn', 'anim-pushBack'] :
      arah === 'pop'  ? ['anim-popFwd', 'anim-popOut']   :
                        ['anim-fadeUp', 'anim-fadeGone'];
    baru.classList.add(masuk);
    lama.classList.add(keluar);
    lama.addEventListener('animationend', () => lama.remove(), { once: true });
    baru.addEventListener('animationend', () => baru.classList.remove(masuk), { once: true });
  }

  aktifkan(baru);
  syncTabbar(rute);
}

function aktifkan(el) {
  /* jeda berurutan untuk daftar */
  el.querySelectorAll('.stagger').forEach(g =>
    [...g.children].forEach((c, i) => c.style.setProperty('--i', i)));

  /* angka menghitung naik */
  el.querySelectorAll('[data-count]').forEach(n => hitung(n, +n.dataset.count));

  /* indikator tab pil */
  const tabs = el.querySelector('[data-ptabs]');
  if (tabs) requestAnimationFrame(() => geserIndikator(tabs));

  /* topbar & FAB bereaksi pada scroll */
  const sc  = el.querySelector('.scroll');
  const bar = el.querySelector('.topbar');
  const fab = el.querySelector('.fab');
  if (sc) {
    let lastY = 0;
    sc.addEventListener('scroll', () => {
      const y = sc.scrollTop;
      if (bar) bar.classList.toggle('is-stuck', y > 6);
      if (fab) {
        if (y > lastY + 6 && y > 40) fab.classList.add('is-tucked');
        else if (y < lastY - 6)      fab.classList.remove('is-tucked');
      }
      lastY = y;
    }, { passive: true });
  }

  /* pencarian langsung di tab penghuni */
  const cari = el.querySelector('[data-search]');
  if (cari) cari.addEventListener('input', () => {
    const q = cari.value.trim().toLowerCase();
    el.querySelectorAll('[data-tlist] > [data-go]').forEach(b => {
      b.style.display = b.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  });
}

/* Ganti isi tab saja, biar indikator pil tetap DOM yang sama dan bisa morph */
function swapBody(layar, rute) {
  const tmp = document.createElement('div');
  tmp.innerHTML = render(rute);

  const baru = tmp.querySelector('[data-tabbody]');
  const lama = layar.querySelector('[data-tabbody]');
  if (!baru || !lama) { layar.innerHTML = render(rute); aktifkan(layar); return; }
  lama.replaceWith(baru);

  /* FAB ikut berubah antar tab */
  const fabLama = layar.querySelector('.fab');
  const fabBaru = tmp.querySelector('.fab');
  if (fabLama) fabLama.remove();
  if (fabBaru) layar.append(fabBaru);

  baru.querySelectorAll('.stagger').forEach(g =>
    [...g.children].forEach((c, i) => c.style.setProperty('--i', i)));
  baru.querySelectorAll('[data-count]').forEach(n => hitung(n, +n.dataset.count));
}

const kurangGerak = () =>
  typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;

function hitung(el, target) {
  if (target === 0 || kurangGerak()) { el.textContent = target; return; }
  const t0 = performance.now(), dur = 400;
  const step = now => {
    const p = Math.min(1, (now - t0) / dur);
    el.textContent = Math.round(target * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function geserIndikator(tabs) {
  const on  = tabs.querySelector('.ptab.is-on');
  const ind = tabs.querySelector('.ptabs-ind');
  if (!on || !ind) return;
  ind.style.width = on.offsetWidth + 'px';
  ind.style.transform = `translateX(${on.offsetLeft}px)`;
}

function syncTabbar(rute) {
  const d = depth(rute);
  tabbar.classList.toggle('is-hidden', d > 0);
  tabbar.innerHTML = TABS.map(t => `<button class="tabitem ${t.r === rute ? 'is-on' : ''}" data-go="${t.r}">
    <span class="tabicon">${ic(t.i, 22)}</span>${t.l}
  </button>`).join('');
}

function ke(rute) {
  if (rute === saatIni) return;
  location.hash = '#/' + rute;
}

function terapkanHash() {
  const rute = (location.hash.replace(/^#\/?/, '') || 'home');
  if (rute === saatIni) return;
  const arah = !saatIni ? 'none'
    : depth(rute) > depth(saatIni) ? 'push'
    : depth(rute) < depth(saatIni) ? 'pop'
    : 'fade';
  saatIni = rute;
  closeSheet(true);
  pasang(rute, arah);
}

/* ══════════════════════════════════════════════
   10. PENANGAN KLIK
   ══════════════════════════════════════════════ */
phone.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-back],[data-sheet],[data-act],[data-tab],[data-f]');
  if (!t) return;

  if (t.dataset.tab !== undefined) {
    if (t.classList.contains('is-on')) return;
    const wadah = t.closest('[data-ptabs]');
    wadah.querySelectorAll('.ptab').forEach(b => b.classList.toggle('is-on', b === t));
    geserIndikator(wadah);                       // pil bergeser & melebar, bukan lompat
    tabState[saatIni] = +t.dataset.tab;
    const layar = t.closest('.screen');
    swapBody(layar, saatIni);
    layar.querySelector('.scroll').scrollTop = 0;
    return;
  }

  if (t.dataset.f) {
    if (t.classList.contains('is-on')) return;
    tenantFilter = t.dataset.f;
    const layar = t.closest('.screen');
    layar.querySelectorAll('[data-tfilter] .fchip').forEach(b => b.classList.toggle('is-on', b === t));
    swapBody(layar, saatIni);
    return;
  }

  if (t.dataset.go)    { closeSheet(); ke(t.dataset.go); return; }
  if (t.hasAttribute('data-back')) { history.back(); return; }
  if (t.dataset.sheet) { openSheet(t.dataset.sheet); return; }
  if (t.dataset.act === 'soon') {
    closeSheet();
    toast('Belum dibuat di ronde 1');
  }
});

/* Tombol back fisik / Esc */
window.addEventListener('hashchange', terapkanHash);
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (sheetEl) closeSheet(); else if (depth(saatIni) > 0) history.back(); }
});
window.addEventListener('resize', () => {
  const tabs = layarEl && layarEl.querySelector('[data-ptabs]');
  if (tabs) geserIndikator(tabs);
});

terapkanHash();
</script>
