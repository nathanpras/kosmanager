<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Cari Kamar Kos</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#F4F6F9;--surf:#fff;--surf2:#EEF1F6;--border:#DDE2EC;--border2:#C8D0E0;
  --text:#0F1724;--text2:#4A5568;--text3:#8A95A8;
  --primary:#1A3C6E;--primary2:#EBF0FA;--primary3:#122C54;--primary4:#C5D4F0;
  --accent:#2563EB;--accent2:#EFF4FF;
  --amber:#D08C0A;--amber2:#FEF5E0;
  --r:14px;--rl:20px;--rxl:24px;
  --sh:0 1px 4px rgba(26,60,110,.08),0 0 0 1px rgba(26,60,110,.06);
  --shm:0 8px 24px rgba(26,60,110,.12),0 0 0 1px rgba(26,60,110,.06);
}
html{background:var(--primary3)}
body{font-family:'Inter',sans-serif;font-size:14px;color:var(--text);background:var(--bg);overflow-x:hidden}

/* ── HERO ── */
.hero{
  background:linear-gradient(160deg,#0A1F3D 0%,#1A3C6E 50%,#1E4D8C 100%);
  color:#fff;position:relative;overflow:hidden;
  padding-bottom:40px;
}
.hero::after{
  content:'';position:absolute;bottom:-2px;left:0;right:0;height:40px;
  background:var(--bg);border-radius:24px 24px 0 0;
}
/* Decorative circles */
.hero-circle1{position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.04);top:-80px;right:-80px;pointer-events:none}
.hero-circle2{position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.04);bottom:40px;left:-60px;pointer-events:none}

.hero-inner{max-width:680px;margin:0 auto;padding:36px 20px 52px;position:relative}
.hero-eyebrow{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;opacity:.65;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.hero-dot{width:6px;height:6px;border-radius:50%;background:#60A5FA;animation:hpulse 2s infinite}
@keyframes hpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
.hero-name{font-size:32px;font-weight:800;letter-spacing:-.6px;line-height:1.15;margin-bottom:10px}
.hero-addr{font-size:13px;opacity:.75;line-height:1.6;margin-bottom:24px;display:flex;align-items:flex-start;gap:6px}
.hero-tagline{font-size:15px;opacity:.85;font-weight:500;margin-bottom:28px;line-height:1.5;max-width:440px}

/* Stats */
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:0}
.stat-box{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.22);border-radius:18px;padding:16px 10px;text-align:center;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 4px 16px rgba(0,0,0,.1)}
.stat-box.highlight{background:rgba(255,255,255,.95);border-color:rgba(255,255,255,.9);box-shadow:0 4px 20px rgba(0,0,0,.15)}
.stat-box.highlight .stat-num{color:var(--primary)!important}
.stat-box.highlight .stat-lbl{color:var(--text2)}
.stat-num{font-size:26px;font-weight:800;line-height:1;margin-bottom:4px;letter-spacing:-.5px}
.stat-num.green{color:#60A5FA}
.stat-lbl{font-size:10px;opacity:.7;font-weight:700;text-transform:uppercase;letter-spacing:.5px}

/* Trust bar */
.trust-bar{background:rgba(0,0,0,.15);border-top:1px solid rgba(255,255,255,.08);padding:12px 20px;display:flex;justify-content:center;gap:24px;flex-wrap:wrap}
.trust-item{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.8;font-weight:600}

/* ── MAIN ── */
.main{max-width:680px;margin:0 auto;padding:20px 16px calc(90px + env(safe-area-inset-bottom,0px))}

/* ── CARDS ── */
.card{background:var(--surf);border:1px solid var(--border);border-radius:var(--rxl);padding:20px;margin-bottom:14px;box-shadow:var(--sh)}
.card-title{font-size:14px;font-weight:700;letter-spacing:-.2px;margin-bottom:4px}
.card-sub{font-size:12px;color:var(--text3)}

/* ── FLOOR MAP ── */
.floor-sec{margin-bottom:16px}
.floor-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text3);display:flex;align-items:center;gap:8px;margin-bottom:10px}
.floor-lbl::after{content:'';flex:1;height:1px;background:var(--border)}
.floor-lbl span{flex-shrink:0}
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.room-box{border-radius:14px;padding:12px 4px;text-align:center;border:2px solid transparent;transition:transform .2s cubic-bezier(.34,1.4,.64,1),box-shadow .2s ease,background .15s}
.room-box.av{background:var(--primary);border-color:var(--primary3);cursor:pointer;box-shadow:0 2px 8px rgba(26,60,110,.25)}
.room-box.av:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(26,60,110,.35)}
.room-box.av:active{transform:scale(.93)}
.room-box.oc{background:var(--surf2);border-color:var(--border);cursor:default}
.room-num{font-size:13px;font-weight:700}
.room-stat{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;margin-top:3px}
.av .room-num{color:#fff}.av .room-stat{color:rgba(255,255,255,.75)}
.oc .room-num{color:var(--text3)}.oc .room-stat{color:var(--text3)}
.legend{display:flex;gap:12px;font-size:11px;color:var(--text2);font-weight:600}
.leg{display:flex;align-items:center;gap:5px}
.leg-dot{width:9px;height:9px;border-radius:3px}
.lg{background:var(--accent)}.lo{background:var(--border2)}

/* ── KAMAR CARD ── */
.kcard{background:var(--surf);border:1px solid var(--border);border-radius:var(--rxl);margin-bottom:14px;overflow:hidden;box-shadow:var(--sh);transition:transform .2s cubic-bezier(.34,1.2,.64,1),box-shadow .2s ease}
.kcard:hover{transform:translateY(-2px);box-shadow:var(--shm)}
.kcard-img{width:100%;height:190px;object-fit:cover;display:block}
.kcard-img-ph{width:100%;height:100px;background:var(--surf2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--text3)}
.kcard-body{padding:14px}
.shimmer{position:relative;overflow:hidden}
.shimmer::after{content:'';position:absolute;top:0;left:-100%;width:60%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);animation:shimmer-move 2.5s infinite}
@keyframes shimmer-move{0%{left:-100%}100%{left:200%}}
.kcard-badge{display:inline-flex;align-items:center;gap:5px;background:var(--primary2);color:var(--primary);border:1px solid var(--primary4);padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:10px}
.kcard-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);animation:hpulse 2s infinite}
.kcard-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.kcard-name{font-size:17px;font-weight:800;letter-spacing:-.3px}
.kcard-tipe{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-top:3px}
.kcard-price{font-size:22px;font-weight:800;color:var(--primary);letter-spacing:-.4px;text-align:right}
.kcard-psub{font-size:11px;color:var(--text3);text-align:right;margin-top:2px}
.kcard-facts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.fact{background:var(--surf2);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--text2);font-weight:500}
.berdua-note{background:var(--amber2);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--amber);font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.kcard-actions{display:flex;flex-direction:column;gap:8px}

/* ── BUTTONS ── */
.btn-wa{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:var(--r);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;transition:all .15s}
.btn-wa:active{transform:scale(.97);background:var(--primary3)}
.btn-video{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:11px;background:var(--surf2);border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-weight:600;color:var(--text);text-decoration:none;transition:background .15s}
.btn-video:active{background:var(--border)}

/* ── INFO ROWS ── */
.info-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--text2)}
.info-val{font-weight:700;display:flex;align-items:center;gap:8px}
.copy-btn{background:var(--primary2);border:none;cursor:pointer;font-size:11px;padding:4px 10px;border-radius:6px;color:var(--primary);font-family:inherit;font-weight:700;transition:all .15s}
.copy-btn:active{transform:scale(.95)}
.copy-btn.ok{background:var(--primary);color:#fff}

/* ── MAPS ── */
.maps-btn{display:flex;align-items:center;gap:8px;padding:13px 16px;background:var(--surf);border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-weight:600;color:var(--text);text-decoration:none;margin-bottom:14px;box-shadow:var(--sh);transition:all .15s}
.maps-btn:hover{background:var(--surf2);transform:translateY(-1px);box-shadow:var(--shm)}
.maps-btn span.arr{margin-left:auto;opacity:.4;font-size:12px}

/* ── EMPTY ── */
.empty{text-align:center;padding:40px 16px;color:var(--text3)}
.empty .ei{font-size:40px;margin-bottom:12px}
.empty p{font-size:13px;font-weight:500;margin-bottom:6px}

/* ── STICKY WA ── */
.sticky-wa{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));right:20px;z-index:100;display:none}
.sticky-wa a{display:flex;align-items:center;gap:8px;background:var(--primary);color:#fff;padding:13px 20px;border-radius:40px;font-size:14px;font-weight:700;text-decoration:none;box-shadow:0 4px 24px rgba(26,60,110,.45),0 0 0 0 rgba(26,60,110,.4);animation:wapulse 2.5s infinite}
@keyframes wapulse{0%{box-shadow:0 4px 24px rgba(26,60,110,.45),0 0 0 0 rgba(26,60,110,.4)}70%{box-shadow:0 4px 24px rgba(26,60,110,.45),0 0 0 12px rgba(26,60,110,0)}100%{box-shadow:0 4px 24px rgba(26,60,110,.45),0 0 0 0 rgba(26,60,110,0)}}
.sticky-wa a:active{transform:scale(.95)}

/* ── SCROLL ANIMATIONS ── */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .5s ease,transform .5s cubic-bezier(.25,.46,.45,.94)}
.reveal.show{opacity:1;transform:translateY(0)}
.reveal-left{opacity:0;transform:translateX(-20px);transition:opacity .5s ease,transform .5s cubic-bezier(.25,.46,.45,.94)}
.reveal-left.show{opacity:1;transform:translateX(0)}

/* ── LOADING ── */
.loading{text-align:center;padding:60px 20px;color:var(--text3)}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}

.footer{text-align:center;padding:20px 16px 0;font-size:12px;color:var(--text3);line-height:2}
.divider{border:none;border-top:1px solid var(--border);margin:14px 0}
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-circle1"></div>
  <div class="hero-circle2"></div>
  <div class="hero-inner">
    <div class="hero-eyebrow"><span class="hero-dot"></span>Hunian Sewa · Jakarta</div>
    <div class="hero-name" id="h-nama">Memuat...</div>
    <div class="hero-addr" id="h-addr"></div>
    <div class="hero-tagline" id="h-tagline"></div>
    <div class="hero-stats">
      <div class="stat-box highlight">
        <div class="stat-num" id="s-av">-</div>
        <div class="stat-lbl">Tersedia</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="s-oc">-</div>
        <div class="stat-lbl">Terisi</div>
      </div>
      <div class="stat-box">
        <div class="stat-num" id="s-tot">-</div>
        <div class="stat-lbl">Total Kamar</div>
      </div>
    </div>
  </div>
  <div class="trust-bar" id="trust-bar" style="display:none">
    <div class="trust-item">✅ Lingkungan Aman</div>
    <div class="trust-item">💧 Air & Listrik 24 Jam</div>
    <div class="trust-item">🔑 Check-in Fleksibel</div>
  </div>
</div>

<!-- MAIN -->
<div class="main" id="main">
  <div class="loading"><div class="spinner"></div>Memuat data kamar...</div>
</div>

<!-- BOTTOM SHEET -->
<div id="bs-overlay" style="display:none;position:fixed;inset:0;background:rgba(10,10,20,.5);z-index:200;backdrop-filter:blur(4px)" onclick="closeBS()"></div>
<div id="bs" style="display:none;position:fixed;bottom:0;left:0;right:0;background:var(--surf);border-radius:24px 24px 0 0;z-index:201;max-height:80vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom,0px);transform:translateY(100%);transition:transform .35s cubic-bezier(.25,.46,.45,.94)">
  <div style="width:36px;height:4px;background:var(--border2);border-radius:4px;margin:12px auto 0"></div>
  <div id="bs-content" style="padding:16px 20px 28px;overflow:hidden"></div>
</div>

<!-- STICKY WA -->
<div class="sticky-wa" id="sticky-wa">
  <a id="sticky-link" href="#">💬 Chat via WA</a>
</div>

<script>
/* ---------------------------------------------------------------------------
   Data halaman ini berasal dari SATU dokumen: koleksi `publik` di Firestore.
   Itu satu-satunya koleksi yang boleh dibaca tanpa login (lihat firestore.rules).

   Sebelumnya halaman ini membaca `properties`, `kamar`, dan `settings` langsung.
   Cara itu berhenti bekerja begitu aturan Firestore diperketat — dan memang
   seharusnya berhenti: jalur yang sama juga membuka data penghuni, tagihan, dan
   nomor rekening kepada siapa pun. Dokumen `publik` hanya berisi apa yang
   memang layak dilihat umum.
--------------------------------------------------------------------------- */
const PID='kos-manager-93c43';
const BASE='https://firestore.googleapis.com/v1/projects/'+PID+'/databases/(default)/documents';

/* Firestore REST membungkus setiap nilai dengan tipenya. Parser lama hanya
   memahami nilai skalar; dokumen publik memuat array dan map, jadi keduanya
   ikut ditangani di sini. */
function pv(v){
  if(v==null)return'';
  if(v.stringValue!==undefined)return v.stringValue;
  if(v.integerValue!==undefined)return parseInt(v.integerValue,10);
  if(v.doubleValue!==undefined)return parseFloat(v.doubleValue);
  if(v.booleanValue!==undefined)return v.booleanValue;
  if(v.nullValue!==undefined)return null;
  if(v.timestampValue!==undefined)return v.timestampValue;
  if(v.arrayValue!==undefined)return(v.arrayValue.values||[]).map(pv);
  if(v.mapValue!==undefined)return pd(v.mapValue);
  return'';
}
function pd(doc){const o={};for(const k in(doc.fields||{}))o[k]=pv(doc.fields[k]);return o}

async function getPublik(){
  const r=await fetch(BASE+'/publik?pageSize=20');
  if(!r.ok)throw new Error('Tidak bisa memuat data ('+r.status+')');
  const d=await r.json();
  return(d.documents||[]).map(x=>({id:x.name.split('/').pop(),...pd(x)}));
}

function fmt(n){return'Rp '+Math.round(n||0).toLocaleString('id-ID')}
function el(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function countUp(el2,target,suffix){
  if(!el2)return;
  if(target===0){el2.textContent='0'+(suffix||'');return}
  const dur=1000;const start=performance.now();
  function frame(now){
    const t=Math.min((now-start)/dur,1);
    const ease=1-Math.pow(1-t,3);
    el2.textContent=Math.round(ease*target)+(suffix||'');
    if(t<1)requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function initReveal(){
  const obs=new IntersectionObserver((entries)=>{
    entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('show');obs.unobserve(e.target)}});
  },{threshold:.1,rootMargin:'0px 0px -40px 0px'});
  document.querySelectorAll('.reveal,.reveal-left').forEach(el2=>obs.observe(el2));
}

/* Lantai dibaca dari nomor kamar, dan sengaja memahami dua gaya penomoran:
   yang baru (101 -> lantai 1) dan yang lama (B1 -> lantai 1). Dengan begitu
   halaman ini tetap benar sebelum maupun sesudah penomoran kamar diganti. */
const BLOK={B:1,A:2,C:3,D:4};
function getLantai(nomor){
  const n=String(nomor||'').trim();
  let l=null;
  const angka=/^(\d)(\d{2})$/.exec(n);
  if(angka)l=parseInt(angka[1],10);
  else{
    const huruf=/^([A-Za-z])\s*\d{1,2}$/.exec(n);
    if(huruf)l=BLOK[huruf[1].toUpperCase()]??null;
  }
  return l==null?{label:'Lainnya',order:99}:{label:'Lantai '+l,order:l};
}

async function init(){
  try{
    const semua=await getPublik();
    /* Halaman ini khusus Raffles Kos 23 (Waru). Dicocokkan lewat nama supaya
       tidak perlu menanam id properti di dalam berkas. */
    const p=semua.find(x=>(x.nama||'').toLowerCase().includes('waru'))
          ||semua.find(x=>(x.nama||'').toLowerCase().includes('raffles'))
          ||semua[0];

    if(!p){
      el('main').innerHTML='<div class="card"><div class="empty"><div class="ei">⚠️</div><p>Data kos belum tersedia</p></div></div>';
      el('loading')&&(el('loading').style.display='none');
      return;
    }

    const nama=p.nama||'Kos Kami';
    const kosong=p.kamar||[];
    const denah=p.denah||[];
    const totalKamar=p.total_kamar||denah.length;
    const terisi=Math.max(0,totalKamar-(p.total_kosong||kosong.length));
    const pct=Math.round(terisi/Math.max(totalKamar,1)*100);
    const tambahan=p.tambahan_penghuni||0;
    const waNum=String(p.wa||'').replace(/[^0-9]/g,'').replace(/^0/,'62');

    document.title=nama+' — Kamar Tersedia';
    el('h-nama')&&(el('h-nama').textContent=nama);
    if(p.alamat&&el('h-addr'))el('h-addr').innerHTML='📍 '+esc(p.alamat);

    setTimeout(()=>{
      countUp(el('s-av'),kosong.length);
      countUp(el('s-oc'),terisi);
      countUp(el('s-tot'),totalKamar);
    },400);
    el('trust-bar')&&(el('trust-bar').style.display='flex');

    if(waNum&&el('sticky-link')){
      el('sticky-link').href='https://wa.me/'+waNum+'?text='+encodeURIComponent('Halo, saya ingin tanya info kamar kos yang tersedia di '+nama+'.');
      el('sticky-wa').style.display='block';
    }

    let html='';

    if(p.maps_url||p.alamat){
      const q=encodeURIComponent(p.alamat||nama);
      html+='<div class="card reveal" style="padding:0;overflow:hidden">';
      html+='<iframe src="https://maps.google.com/maps?q='+q+'&output=embed&z=16" width="100%" height="220" style="border:none;display:block" loading="lazy" title="Lokasi Kos"></iframe>';
      if(p.maps_url)html+='<a href="'+esc(p.maps_url)+'" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;font-size:13px;font-weight:600;color:var(--primary);text-decoration:none;border-top:1px solid var(--border)">Buka di Google Maps <span style="font-size:11px">↗</span></a>';
      html+='</div>';
    }

    html+='<div class="card reveal" style="display:flex;gap:12px;flex-wrap:wrap;align-items:center">';
    html+='<div style="flex:1;min-width:120px"><div style="font-size:22px;font-weight:800;color:var(--primary)">'+pct+'%</div><div style="font-size:12px;color:var(--text2);font-weight:500">Tingkat hunian</div></div>';
    html+='<div style="width:1px;background:var(--border);height:36px"></div>';
    html+='<div style="flex:1;min-width:120px"><div style="font-size:22px;font-weight:800;color:var(--text)">'+kosong.length+'</div><div style="font-size:12px;color:var(--text2);font-weight:500">Kamar tersedia</div></div>';
    html+='<div style="width:1px;background:var(--border);height:36px"></div>';
    html+='<div style="flex:1;min-width:120px"><div style="font-size:22px;font-weight:800;color:var(--text)">'+totalKamar+'</div><div style="font-size:12px;color:var(--text2);font-weight:500">Total kamar</div></div>';
    html+='</div>';

    if(denah.length){
      const urut=[...denah].sort((a,b)=>{
        const la=getLantai(a.nomor),lb=getLantai(b.nomor);
        if(la.order!==lb.order)return la.order-lb.order;
        return String(a.nomor).localeCompare(String(b.nomor),undefined,{numeric:true});
      });
      const floors={};const fOrder=[];
      urut.forEach(k=>{const l=getLantai(k.nomor).label;if(!floors[l]){floors[l]=[];fOrder.push(l)}floors[l].push(k)});

      html+='<div class="card reveal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px"><div><div class="card-title">Peta Kamar</div><div class="card-sub">Tap kamar hijau untuk lihat detail</div></div><div class="legend"><div class="leg"><div class="leg-dot lg"></div>Kosong</div><div class="leg"><div class="leg-dot lo"></div>Terisi</div></div></div>';
      fOrder.forEach(lantai=>{
        html+='<div class="floor-sec"><div class="floor-lbl"><span>'+esc(lantai)+'</span></div><div class="room-grid">';
        floors[lantai].forEach(k=>{
          const av=!!k.kosong;
          html+='<div class="room-box '+(av?'av':'oc')+'"'+(av?' onclick="openBS(&quot;'+esc(k.nomor)+'&quot;)"':'')+'>'+
            '<div class="room-num">'+esc(k.nomor)+'</div>'+
            '<div class="room-stat">'+(av?'Kosong':'Terisi')+'</div></div>';
        });
        html+='</div></div>';
      });
      html+='</div>';
    }

    if(kosong.length>0){
      html+='<div class="card-title" style="margin:4px 0 12px;font-size:15px;font-weight:700;letter-spacing:-.2px">Kamar Tersedia <span style="background:var(--primary2);color:var(--primary);padding:2px 10px;border-radius:20px;font-size:12px;font-weight:700;margin-left:4px">'+kosong.length+'</span></div>';
      kosong.forEach((k,i)=>{
        const harga=k.harga||0;
        const waMsg=encodeURIComponent('Halo, saya tertarik dengan Kamar '+k.nomor+' ('+(k.tipe||'')+') seharga '+fmt(harga)+'/bulan di '+nama+'. Apakah masih tersedia?');
        const waHref=waNum?'https://wa.me/'+waNum+'?text='+waMsg:'#';
        html+='<div class="kcard reveal" id="rm-'+esc(k.nomor)+'" style="transition-delay:'+(i*60)+'ms">';
        if(k.foto)html+='<img src="'+esc(k.foto)+'" class="kcard-img" loading="lazy" alt="Kamar '+esc(k.nomor)+'">';
        else html+='<div class="kcard-img-ph"><span style="font-size:28px">🏠</span><span style="font-size:11px;font-weight:600">Foto belum tersedia</span></div>';
        html+='<div class="kcard-body">';
        html+='<div class="kcard-badge shimmer">Tersedia Sekarang</div>';
        html+='<div class="kcard-top">';
        html+='<div><div class="kcard-name">Kamar '+esc(k.nomor)+'</div><div class="kcard-tipe">'+esc(k.tipe)+'</div></div>';
        html+='<div><div class="kcard-price">'+fmt(harga)+'</div><div class="kcard-psub">/ bulan</div></div>';
        html+='</div>';
        if(tambahan>0)html+='<div class="berdua-note">💑 Bisa berdua: '+fmt(harga+tambahan)+'/bln</div>';
        html+='<div class="kcard-facts">';
        if(k.deposit)html+='<span class="fact">💰 Deposit '+fmt(k.deposit)+'</span>';
        if(k.kategori)html+='<span class="fact">🏷️ '+esc(k.kategori)+'</span>';
        html+='</div>';
        html+='<div class="kcard-actions">';
        if(waNum)html+='<a href="'+waHref+'" target="_blank" rel="noopener" class="btn-wa">💬 Tanya via WhatsApp</a>';
        html+='</div></div></div>';
      });
    } else {
      html+='<div class="card reveal"><div class="empty"><div class="ei">😔</div><p style="font-size:15px;font-weight:700;color:var(--text)">Semua kamar terisi</p><p>Hubungi kami untuk info waiting list</p>';
      if(waNum)html+='<a href="https://wa.me/'+waNum+'?text='+encodeURIComponent('Halo, ada kamar yang akan kosong?')+'" target="_blank" rel="noopener" class="btn-wa" style="margin-top:16px">💬 Tanya via WhatsApp</a>';
      html+='</div></div>';
    }

    /* Nomor rekening sengaja TIDAK ditampilkan di sini. Halaman ini terbuka
       untuk umum, dan memampang rekening memudahkan penipu meniru kos ini
       dengan rekening lain. Rekening diberikan lewat WhatsApp setelah cocok. */

    html+='<div class="footer reveal">'+esc(nama)+' &nbsp;·&nbsp; Jakarta<br>Untuk info lebih lanjut hubungi kami via WhatsApp</div>';

    el('main').innerHTML=html;
    el('loading')&&(el('loading').style.display='none');

    window._kamar=kosong;
    window._wa=waNum;
    window._tambahan=tambahan;
    setTimeout(initReveal,100);

  }catch(e){
    el('main').innerHTML='<div class="loading"><div style="font-size:36px;margin-bottom:12px">⚠️</div><div style="font-weight:700;margin-bottom:8px">Gagal memuat</div><div style="font-size:12px;color:var(--text3);background:var(--surf2);padding:10px;border-radius:8px;margin-bottom:14px;word-break:break-all">'+esc(e.message)+'</div><button onclick="location.reload()" style="padding:12px 24px;background:var(--primary);color:#fff;border:none;border-radius:var(--r);cursor:pointer;font-size:14px;font-weight:700;font-family:inherit">🔄 Coba Lagi</button></div>';
  }
}

function scrollTo_(id){const e=document.getElementById(id);if(e)e.scrollIntoView({behavior:'smooth',block:'center'})}

function openBS(nomor){
  const k=(window._kamar||[]).find(x=>String(x.nomor)===String(nomor));
  if(!k)return;
  const waNum=window._wa||'';
  const tambahan=window._tambahan||0;
  const harga=k.harga||0;
  const waMsg=encodeURIComponent('Halo, saya tertarik dengan Kamar '+k.nomor+' ('+(k.tipe||'')+') seharga '+fmt(harga)+'/bulan. Apakah masih tersedia?');
  const waHref=waNum?'https://wa.me/'+waNum+'?text='+waMsg:'#';
  let html='';
  if(k.foto){
    html+='<img src="'+esc(k.foto)+'" style="height:200px;object-fit:cover;display:block;margin:-16px -20px 16px;width:calc(100% + 40px);border-radius:0" alt="Kamar '+esc(k.nomor)+'">';
  } else {
    html+='<div style="width:calc(100% + 40px);height:120px;background:var(--surf2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin:-16px -20px 16px;color:var(--text3)"><span style="font-size:32px">🏠</span><span style="font-size:12px;font-weight:600">Foto belum tersedia</span></div>';
  }
  html+='<div style="display:inline-flex;align-items:center;gap:5px;background:var(--primary2);color:var(--primary);border:1px solid var(--primary4);padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:12px"><span style="width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block"></span>Tersedia Sekarang</div>';
  html+='<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px">';
  html+='<div><div style="font-size:20px;font-weight:800;letter-spacing:-.3px">Kamar '+esc(k.nomor)+'</div>';
  html+='<div style="font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-top:3px">'+esc(k.tipe)+'</div></div>';
  html+='<div style="text-align:right"><div style="font-size:22px;font-weight:800;color:var(--primary)">'+fmt(harga)+'</div><div style="font-size:11px;color:var(--text3)">/ bulan</div></div>';
  html+='</div>';
  if(tambahan>0)html+='<div style="background:var(--amber2);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--amber);font-weight:600;margin-bottom:12px">💑 Bisa berdua: '+fmt(harga+tambahan)+'/bln (+'+fmt(tambahan)+')</div>';
  html+='<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px">';
  if(k.deposit)html+='<span style="background:var(--surf2);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--text2);font-weight:500">💰 Deposit '+fmt(k.deposit)+'</span>';
  if(k.kategori)html+='<span style="background:var(--surf2);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--text2);font-weight:500">🏷️ '+esc(k.kategori)+'</span>';
  html+='</div>';
  if(waNum)html+='<a href="'+waHref+'" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:var(--r);font-size:15px;font-weight:700;text-decoration:none">💬 Tanya via WhatsApp</a>';
  document.getElementById('bs-content').innerHTML=html;
  document.getElementById('bs-overlay').style.display='block';
  const bs=document.getElementById('bs');bs.style.display='block';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{bs.style.transform='translateY(0)'}));
}
function closeBS(){
  const bs=document.getElementById('bs');
  bs.style.transform='translateY(100%)';
  setTimeout(()=>{bs.style.display='none';document.getElementById('bs-overlay').style.display='none'},350);
}

window.addEventListener('scroll',()=>{
  const w=el('sticky-wa');if(w)w.style.opacity=scrollY>300?'1':'0';
},{passive:true});

init();
</script>
</body>
</html>
